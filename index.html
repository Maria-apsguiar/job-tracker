<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Job Tracker</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <header class="header">

    <div class="header-content">

      <div>
        <h1>Job Tracker</h1>
        <p>
          Sistema de gestão de candidaturas
        </p>
      </div>

      <button
        id="btnNovaCandidatura"
        class="btn-primary"
      >
        + Nova candidatura
      </button>

    </div>

  </header>


  <main class="container">

    <!-- DASHBOARD -->

    <section class="dashboard">

      <div class="kpi-card">

        <span class="kpi-label">
          Total
        </span>

        <strong
          id="totalCandidaturas"
          class="kpi-value"
        >
          0
        </strong>

      </div>


      <div class="kpi-card">

        <span class="kpi-label">
          Em andamento
        </span>

        <strong
          id="candidaturasAndamento"
          class="kpi-value"
        >
          0
        </strong>

      </div>


      <div class="kpi-card">

        <span class="kpi-label">
          Com retorno
        </span>

        <strong
          id="candidaturasComRetorno"
          class="kpi-value"
        >
          0
        </strong>

      </div>


      <div class="kpi-card">

        <span class="kpi-label">
          Aprovadas
        </span>

        <strong
          id="candidaturasAprovadas"
          class="kpi-value"
        >
          0
        </strong>

      </div>

    </section>


    <!-- CANDIDATURAS -->

    <section class="section">

      <div class="section-header">

        <div>

          <h2>Candidaturas</h2>

          <p>
            Acompanhe seus processos seletivos
          </p>

        </div>


        <div class="filters">

          <select
            id="filtroStatus"
            aria-label="Filtrar por status"
          >

            <option value="">
              Todos os status
            </option>

            <option value="candidatura enviada">
              Candidatura enviada
            </option>

            <option value="em análise">
              Em análise
            </option>

            <option value="entrevista rh">
              Entrevista RH
            </option>

            <option value="entrevista técnica">
              Entrevista técnica
            </option>

            <option value="teste técnico">
              Teste técnico
            </option>

            <option value="entrevista gestor">
              Entrevista gestor
            </option>

            <option value="proposta">
              Proposta
            </option>

            <option value="aprovado">
              Aprovado
            </option>

            <option value="negado">
              Negado
            </option>

            <option value="desisti">
              Desisti
            </option>

          </select>

        </div>

      </div>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <div
        id="listaCandidaturas"
        class="candidaturas-grid"
      ></div>

    </section>

  </main>


  <!-- MODAL NOVA CANDIDATURA -->

  <div
    id="modalCandidatura"
    class="modal-overlay hidden"
  >

    <div class="modal">

      <div class="modal-header">

        <div>

          <h2>Nova candidatura</h2>

          <p>
            Cadastre uma nova oportunidade
          </p>

        </div>

        <button
          id="btnFecharModal"
          class="btn-close"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="formCandidatura">

        <div class="form-grid">

          <div class="form-group">

            <label for="empresa">
              Empresa
            </label>

            <input
              id="empresa"
              name="empresa"
              type="text"
              required
            >

          </div>


          <div class="form-group">

            <label for="vaga">
              Vaga
            </label>

            <input
              id="vaga"
              name="vaga"
              type="text"
              required
            >

          </div>


          <div class="form-group">

            <label for="data_candidatura">
              Data da candidatura
            </label>

            <input
              id="data_candidatura"
              name="data_candidatura"
              type="date"
              required
            >

          </div>


          <div class="form-group">

            <label for="tipo_contratacao">
              Tipo de contratação
            </label>

            <select
              id="tipo_contratacao"
              name="tipo_contratacao"
            >

              <option value="clt">CLT</option>
              <option value="pj">PJ</option>
              <option value="temporário">
                Temporário
              </option>
              <option value="estágio">
                Estágio
              </option>
              <option value="freelancer">
                Freelancer
              </option>
              <option value="outro">
                Outro
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="modalidade">
              Modalidade
            </label>

            <select
              id="modalidade"
              name="modalidade"
            >

              <option value="remoto">
                Remoto
              </option>

              <option value="híbrido">
                Híbrido
              </option>

              <option value="presencial">
                Presencial
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="localizacao">
              Localização
            </label>

            <input
              id="localizacao"
              name="localizacao"
              type="text"
            >

          </div>


          <div class="form-group">

            <label for="plataforma">
              Plataforma
            </label>

            <select
              id="plataforma"
              name="plataforma"
            >

              <option value="linkedin">
                LinkedIn
              </option>

              <option value="gupy">
                Gupy
              </option>

              <option value="vagas.com">
                Vagas.com
              </option>

              <option value="infojobs">
                InfoJobs
              </option>

              <option value="indeed">
                Indeed
              </option>

              <option value="glassdoor">
                Glassdoor
              </option>

              <option value="site da empresa">
                Site da empresa
              </option>

              <option value="indicação">
                Indicação
              </option>

              <option value="outro">
                Outro
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="link_vaga">
              Link da vaga
            </label>

            <input
              id="link_vaga"
              name="link_vaga"
              type="url"
              placeholder="https://..."
            >

          </div>


          <div class="form-group">

            <label for="salario_min">
              Salário mínimo
            </label>

            <input
              id="salario_min"
              name="salario_min"
              type="number"
              min="0"
              step="0.01"
            >

          </div>


          <div class="form-group">

            <label for="salario_max">
              Salário máximo
            </label>

            <input
              id="salario_max"
              name="salario_max"
              type="number"
              min="0"
              step="0.01"
            >

          </div>


          <div class="form-group">

            <label for="salario_informado">
              Salário informado
            </label>

            <input
              id="salario_informado"
              name="salario_informado"
              type="text"
            >

          </div>

        </div>


        <div class="form-group">

          <label for="observacoes">
            Observações
          </label>

          <textarea
            id="observacoes"
            name="observacoes"
            rows="4"
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            id="btnCancelar"
            class="btn-secondary"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-primary"
          >
            Salvar candidatura
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
